<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Post</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="post">

    <div class="post-header">
        <div class="header-left">
            <i class="fa-brands fa-2x fa-html5"></i>
            <div>
                <strong>HTML5</strong>
                <p>Johan</p>
            </div>
        </div>
        <div class="header-right">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </div>
    </div>

    <div class="post-img">
        <img src="https://picsum.photos/id/773/600/400">
    </div>

    <div class="post-icons">
        <div class="icons-left">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-comment"></i>
            <i class="fa-regular fa-paper-plane"></i>
        </div>

        <div class="icons-right">
            <i class="fa-regular fa-bookmark"></i>
        </div>
    </div>

    <div class="post-body">
        <p>Liked by <strong>4GeeksAcademy</strong>, <strong>html5</strong>, Web and <strong>100,000 others</strong></p>

        <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Distinctio officiis esse, commodi maxime quibusdam sit provident ut ea quam pariatur sunt expedita cum dolorum non et magnam voluptate impedit atque?
    </div>

</div>

</body>
</html>
